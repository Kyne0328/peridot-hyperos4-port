name: Builder tests

on:
  push:
    branches: [main]
    paths: ['builder/**', 'tools/global-build/convert_thermal_review.py', '.github/workflows/builder.yml']
  pull_request:
    paths: ['builder/**', 'tools/global-build/convert_thermal_review.py', '.github/workflows/builder.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: builder-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Unit tests
        working-directory: builder
        run: python -m unittest discover -s tests -v

  toolchain:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Bootstrap pinned tools
        shell: pwsh
        run: ./builder/scripts/bootstrap_tools.ps1
      - name: Toolchain preflight
        working-directory: builder
        run: python -m peridot_builder preflight --require-profile-tools
