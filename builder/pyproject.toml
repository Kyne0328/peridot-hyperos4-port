[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peridot-hyperos-builder"
version = "0.1.0"
description = "Evidence-first HyperOS port builder foundation for POCO F6 / Redmi Turbo 3 (peridot)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
peridot-builder = "peridot_builder.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["peridot_builder*"]
